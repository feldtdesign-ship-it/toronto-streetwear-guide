<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0F1112}
.card{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box;color:#EDEAE2;font-family:"Source Serif 4",Georgia,serif;display:flex;flex-direction:column;justify-content:space-between}
.bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:#EF3340}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:#6E6D68}
h1{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;text-transform:uppercase;line-height:.88;margin:18px 0 0;font-size:124px;letter-spacing:.005em;white-space:nowrap}
h1 span{color:#EF3340;display:block}
.dek{font-size:30px;line-height:1.35;color:#A9A79F;max-width:820px;margin-top:26px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-family:"IBM Plex Mono",monospace;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:#6E6D68}
.leaf{position:absolute;right:64px;top:44px;font-size:170px;line-height:1}
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="leaf" aria-hidden="true">🍁</div>
  <div>
    <div class="eyebrow">A tip sheet for PJ &amp; Jillian</div>
    <h1>Toronto <span>Streetwear &amp; Art</span></h1>
    <p class="dek">Shops, record bins, artist markets, galleries, and the photo you'll actually want. Craft over hype.</p>
  </div>
  <div class="foot"><span>33 stops · 10 neighborhoods · tap to flip</span><span>feldtdesign-ship-it.github.io</span></div>
</div>
</body>
</html>
